name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID:             ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID:             ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:       ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:              "true"
      TF_VAR_vpn_root_cert_data: ${{ secrets.TF_VAR_VPN_ROOT_CERT_DATA }}
      TF_DIR:                    "Terraform/Network Architecture"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Debug and verify tfvars
        run: |
          echo "Runner workspace: $GITHUB_WORKSPACE"
          echo "TF directory: $TF_DIR"
          cd "$GITHUB_WORKSPACE/$TF_DIR"
          echo "Current dir: $(pwd)"
          ls -la
          echo "tfvars exists:" && cat terraform.tfvars || echo "NOT FOUND"

      - name: Terraform Init
        run: |
          cd "$GITHUB_WORKSPACE/$TF_DIR"
          terraform init \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=network.terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        run: |
          cd "$GITHUB_WORKSPACE/$TF_DIR"
          terraform validate

      - name: Terraform Plan
        run: |
          cd "$GITHUB_WORKSPACE/$TF_DIR"
          terraform plan \
            -var-file="terraform.tfvars" \
            -no-color \
            -out=tfplan

      - name: Terraform Apply
        run: |
          cd "$GITHUB_WORKSPACE/$TF_DIR"
          terraform apply -auto-approve tfplan
