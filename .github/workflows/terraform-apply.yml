name: Terraform Network Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'Terraform/Network Architecture/**.tf'
      - 'Terraform/Network Architecture/**.tfvars'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID:             ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID:             ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:       ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:              "true"
      TF_VAR_vpn_root_cert_data: ${{ secrets.TF_VAR_VPN_ROOT_CERT_DATA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      # ==============================================
      # THE METHOD FROM YOUR OLD PROJECT:
      # Pre-flight validation to ensure files exist
      # ==============================================
      - name: Validate Terraform Files
        run: |
          ERR=0
          TF_DIR="Terraform/Network Architecture"
          TF_VARS="$TF_DIR/terraform.tfvars"
          
          if [ ! -d "$TF_DIR" ]; then
            echo "::error::Directory $TF_DIR does not exist."
            ERR=1
          fi
          
          if [ ! -f "$TF_VARS" ]; then
            echo "::error::File $TF_VARS does not exist. Please commit it to the repository."
            ERR=1
          fi
          
          [[ $ERR -eq 0 ]] || exit 1
          echo "✅ Pre-flight validation passed."

      # ==============================================
      # Using working-directory instead of 'cd'
      # ==============================================
      - name: Terraform Init
        working-directory: "Terraform/Network Architecture"
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=network.terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        working-directory: "Terraform/Network Architecture"
        run: terraform validate

      - name: Terraform Plan
        working-directory: "Terraform/Network Architecture"
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -no-color \
            -out=tfplan

      - name: Terraform Apply
        working-directory: "Terraform/Network Architecture"
        run: terraform apply -auto-approve tfplan