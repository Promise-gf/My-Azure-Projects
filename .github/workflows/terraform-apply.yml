name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID:             ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID:             ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:       ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:              "true"
      TF_VAR_vpn_root_cert_data: ${{ secrets.TF_VAR_VPN_ROOT_CERT_DATA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug filesystem
        run: |
          echo "=== GITHUB_WORKSPACE ==="
          echo $GITHUB_WORKSPACE
          echo "=== Root contents ==="
          ls -la $GITHUB_WORKSPACE
          echo "=== Terraform folder ==="
          ls -la "$GITHUB_WORKSPACE/Terraform/" || echo "Terraform folder not found"
          echo "=== Network Architecture folder ==="
          ls -la "$GITHUB_WORKSPACE/Terraform/Network Architecture/" || echo "Network Architecture folder not found"
          echo "=== All tfvars files ==="
          find $GITHUB_WORKSPACE -name "*.tfvars"
          echo "=== All tf files ==="
          find $GITHUB_WORKSPACE -name "*.tf" | head -10

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: "Terraform/Network Architecture"
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=network.terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        working-directory: "Terraform/Network Architecture"
        run: terraform validate

      - name: Terraform Plan
        working-directory: "Terraform/Network Architecture"
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -no-color \
            -out=tfplan

      - name: Terraform Apply
        working-directory: "Terraform/Network Architecture"
        run: terraform apply -auto-approve tfplan
