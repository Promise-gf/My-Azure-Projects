name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - '**.tf'
      - '**.tfvars'
  workflow_dispatch:

jobs:
  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest
    environment: production

    permissions:
      id-token: write
      contents: read

    env:
      ARM_CLIENT_ID:             ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID:             ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID:       ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_USE_OIDC:              "true"
      TF_VAR_vpn_root_cert_data: ${{ secrets.TF_VAR_VPN_ROOT_CERT_DATA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
          terraform_wrapper: false

      - name: Debug directory
        run: |
          cd "$GITHUB_WORKSPACE/Terraform/Network Architecture"
          echo "pwd=$(pwd)"
          ls -la

      - name: Terraform Init
        run: |
          cd "$GITHUB_WORKSPACE/Terraform/Network Architecture"
          terraform init \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=${{ secrets.BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=network.terraform.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        run: |
          cd "$GITHUB_WORKSPACE/Terraform/Network Architecture"
          terraform validate

      # ==============================================
      # THIS IS THE STEP THAT CHANGES:
      # ==============================================
      - name: Terraform Plan
        run: |
          cd "$GITHUB_WORKSPACE/Terraform/Network Architecture"
          
          # 1. Create the tfvars file dynamically so Git doesn't need to track it
          cat > terraform.tfvars << 'EOF'
          resource_group_name   = "rg-corp-network-dev"
          location              = "centralus"
          prefix                = "corp"
          environment           = "prod"

          subnets = {
            web                 = "10.10.1.0/24"
            app                 = "10.10.2.0/24"
            db                  = "10.10.3.0/24"
            pe                  = "10.10.4.0/24"
            gateway             = "10.10.255.224/27"
            AzureBastionSubnet  = "10.10.254.0/26"
            AzureFirewallSubnet = "10.10.253.0/26"
            secondary           = "10.20.1.0/24"
          }

          deploy_vpn               = true
          deploy_bastion           = true
          deploy_firewall          = true
          deploy_log_analytics     = true
          deploy_key_vault         = true
          deploy_private_endpoints = true
          EOF
          
          # 2. Run the plan (it will find the file created above)
          terraform plan \
            -var-file="terraform.tfvars" \
            -no-color \
            -out=tfplan
      # ==============================================

      - name: Terraform Apply
        run: |
          cd "$GITHUB_WORKSPACE/Terraform/Network Architecture"
          terraform apply -auto-approve tfplan