name: CI - Application

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'

permissions:
  id-token: write   # Required for OIDC Azure Login
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "src/functions/requirements.txt"

      - name: Install Dependencies
        run: |
          pip install -r src/functions/requirements.txt
          pip install pytest pytest-cov ruff bandit mypy types-requests

      # Enterprise: Fast Linting
      - name: Lint with Ruff
        run: ruff check src/

      # Enterprise: Static Type Checking (Crucial for Pydantic V2)
      - name: Type Check with Mypy
        run: mypy src/ --ignore-missing-imports

      # Enterprise: Python Security Scanning
      - name: Security Scan with Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true
        
      # Enterprise: Unit Tests with 80% Coverage Gate
      - name: Run Tests
        run: pytest tests/ --cov=src --cov-fail-under=80 -v

      # Build the Docker Container for Azure Functions
      - name: Build Container
        run: docker build -t cost-functions:${{ github.sha }} -f src/functions/Dockerfile src/functions/

      # Enterprise: Container Vulnerability Scanning
      - name: Scan Container (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "cost-functions:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      # Push to ACR if all checks pass
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Push to ACR
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}
          docker tag cost-functions:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/cost-functions:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/cost-functions:${{ github.sha }}
  integration-test:
    needs: validate-and-build # Only run if unit tests and build pass
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "src/functions/requirements.txt"

      - name: Install Dependencies
        run: |
          pip install -r src/functions/requirements.txt
          pip install pytest pytest-asyncio

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run Integration Tests (Against Dev Sandbox)
        env:
          RUN_INTEGRATION_TESTS: "true"
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          STORAGE_ACCOUNT_NAME: ${{ secrets.DEV_STORAGE_ACCOUNT_NAME }} # e.g., stcvddev01
        run: pytest tests/integration/ -v